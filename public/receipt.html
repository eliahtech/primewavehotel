<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt | PrimeWave Hotel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets.css">
<style>
.wrap{max-width:560px;margin:30px auto;padding:0 16px}
.rh{text-align:center;border-bottom:2px solid var(--gold);padding-bottom:14px;margin-bottom:16px}
.rh h1{font-family:'Playfair Display',serif;color:var(--navy);font-size:22px;letter-spacing:2px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.row span:first-child{color:var(--muted)}.row span:last-child{font-weight:600;text-align:right}
.total{font-size:17px;color:var(--navy)}
@media print{header.top,.noprint{display:none}body{background:#fff}.card{box-shadow:none}}
</style></head><body>
<header class="top"><a class="logo" href="/">PRIME<em>WAVE</em></a><a class="l" href="/book.html">My bookings</a></header>
<div class="wrap"><div class="card" id="box">Loading receipt…</div>
<p class="noprint" style="text-align:center;margin-top:16px"><button class="btn gold" onclick="print()">Print / Save PDF</button></p></div>
<script>
'use strict';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kes = n => 'KES ' + Number(n||0).toLocaleString();
const id = new URLSearchParams(location.search).get('booking_id');
const token = sessionStorage.getItem('pw_token');
const box = document.getElementById('box');
if(!id){ box.textContent='No booking specified.'; }
else if(!token){ location.href='/login.html?redirect='+encodeURIComponent(location.pathname+location.search); }
else fetch('/api/bookings/'+encodeURIComponent(id)+'/receipt',{headers:{Authorization:'Bearer '+token}})
 .then(async r=>{ if(r.status===401){ sessionStorage.clear(); location.href='/login.html?redirect='+encodeURIComponent(location.pathname+location.search); return null; } return r.json(); })
 .then(j=>{
   if(!j) return;
   if(j.status!=='success'){ box.textContent=j.message||'Could not load receipt.'; return; }
   const b=j.data.booking, p=(j.data.payments||[])[0]||{}, tz=j.data.timezone;
   const dt = v => new Date(v).toLocaleString('en-GB',{timeZone:tz,dateStyle:'medium',timeStyle:'short'});
   const unit = b.type==='table' ? (b.nights===1?'hour':'hours') : (b.nights===1?'night':'nights');
   const rows = [['Booking ID',b.booking_id],['Status',b.status.replace('_',' ')],['Guest',b.guest_name],['Item',j.data.item_label],
     ['Check-in',dt(b.checkin_date)],['Check-out',dt(b.checkout_date)],['Duration',b.nights+' '+unit],['Guests',b.num_guests],
     ['Subtotal',kes(b.subtotal)],['VAT (16%)',kes(b.tax)],['Payment method',p.method||b.payment_method||'—'],['Reference',p.tracking_id||b.pesapal_tracking_id||'—']];
   box.innerHTML = '<div class="rh"><h1>'+esc(j.data.hotel.name.toUpperCase())+'</h1><div style="color:var(--muted);font-size:13px">Official Receipt</div></div>'
     + rows.map(r=>'<div class="row"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>').join('')
     + '<div class="row total"><span>TOTAL '+(b.payment_status==='paid'?'PAID':'DUE')+'</span><span>'+kes(b.total_amount)+'</span></div>'
     + '<p style="margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center">Questions? '+esc(j.data.hotel.email||'')+'</p>';
 }).catch(()=>{ box.textContent='Network error. Please refresh.'; });
</script></body></html>
